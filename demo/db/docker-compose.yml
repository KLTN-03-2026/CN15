# PostgreSQL cho Hệ thống thu gom rác tái chế thông minh
# Chạy: docker compose -f db/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-recycling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123123"
      POSTGRES_DB: smart_recycling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
